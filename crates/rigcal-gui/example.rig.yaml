# 四路仪表盘配置示例（rigcal-gui）。
#
# RTSP 端口为 554 + 通道号，路径为 /PRR；可用 --rtsp-base <host> 统一覆盖。
# 下面的 video 写法是把**本地视频**当引导源（与 RTSP 走同一条解码路径，按流帧率节流），
# 用于没有相机时的演练：`cargo run -p rigcal-io --features drills --bin mock-raw-server` 充当证据帧服务。
schema_version: 1
device:
  rig_id: robobaton_4p_demo
  image_size: [1280, 1088]
board:
  target_type: aprilgrid
  target_id: robobaton_4p_6x6_36h11
  measured: true
  rows: 6
  cols: 6
  first_tag_id: 0
  tag_corner_order: [bottom_right, bottom_left, top_left, top_right]
  tag_size_m: 0.088
  tag_spacing_ratio: 0.3
  dictionary: DICT_APRILTAG_36h11
guidance:
  detect_scale: 0.75
  detect_hz: 0.5
  detect_hz_max: 12.0
  jitter_xyz: 0.025
  jitter_z: 0.04
  jitter_rotation_deg: 2.0
  trigger_novelty_scale: 3.0
  trigger_min_interval_s: 0.5
solver:
  models: [kb4]
  min_observations: 12
  max_solve_observations: 30
  holdout_fraction: 0.25
  official_holdout_frames: 6
  max_holdout_rms_px: 1.0
  max_holdout_p95_px: 1.0
  quality:
    min_focus_score: 500.0
    min_contrast: 20.0
    max_saturated_fraction: 0.35
rig:
  rig_id: robobaton_4p_demo
  cameras:
    - camera_id: cam0
      guidance: {type: video, path: /tmp/guide_cam0.mp4}
      raw_camera_id: 0
    - camera_id: cam1
      guidance: {type: video, path: /tmp/guide_cam1.mp4}
      raw_camera_id: 1
    - camera_id: cam2
      guidance: {type: video, path: /tmp/guide_cam2.mp4}
      raw_camera_id: 2
    - camera_id: cam3
      guidance: {type: video, path: /tmp/guide_cam3.mp4}
      raw_camera_id: 3
  # 证据服务端口以板端为准：`~/demo/config/sensor_config.yaml` 的 `raw_server.port`
  # 此处使用本地 mock 端点；连接设备时通过 --evidence 覆盖。
  evidence: {host: 127.0.0.1, port: 4211}
  required_edges: [[cam0, cam1], [cam1, cam2], [cam2, cam3], [cam3, cam0]]
  required_cycles: [[cam0, cam1, cam2, cam3]]
  min_groups_per_edge: 3
  max_edge_rms_px: 1.0
  max_cycle_rotation_deg: 1.0
  max_cycle_translation_mm: 10.0
output:
  root: calibration_runs/rig_gui
