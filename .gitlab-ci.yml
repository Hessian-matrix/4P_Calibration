workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - build
  - release

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.98.1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CORP_INDEX_SSH: "ssh://git@10.21.12.53:2222/corp/rd/camera_corelib.git"
  CORP_INDEX_HTTP: "http://10.21.12.53:8929/corp/rd/camera_corelib.git"

default:
  cache:
    key: "cargo-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
      - .ci-tools/
    policy: pull-push

.registry-linux:
  image: "$CI_REGISTRY/corp/rd/camera_corelib/ci-rust:1.98.1-bookworm-v1"
  tags: [wsl, docker]
  before_script:
    - export CARGO_REGISTRIES_CORP_TOKEN="Basic $(printf 'gitlab-ci-token:%s' "$CI_JOB_TOKEN" | base64 -w0)"
    - git config --global url."http://gitlab-ci-token:${CI_JOB_TOKEN}@10.21.12.53:8929/corp/rd/camera_corelib.git".insteadOf "$CORP_INDEX_SSH"

.zig-cross:
  extends: .registry-linux
  before_script:
    - !reference [.registry-linux, before_script]
    - mkdir -p .ci-tools
    - test -x .ci-tools/zig/zig || (python3 -c 'import urllib.request; urllib.request.urlretrieve("https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz", ".ci-tools/zig.tar.xz")' && tar -xJf .ci-tools/zig.tar.xz -C .ci-tools && mv .ci-tools/zig-linux-x86_64-0.13.0 .ci-tools/zig)
    - export PATH="$CI_PROJECT_DIR/.ci-tools/zig:$CARGO_HOME/bin:$PATH"
    - command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --version 0.20.1 --locked

verify:linux:
  extends: .registry-linux
  before_script:
    - !reference [.registry-linux, before_script]
    - rustup component add clippy
  stage: verify
  script:
    - cargo test --locked
    - cargo clippy --all-targets --locked -- -D clippy::correctness

build:linux-x86_64:
  extends: .registry-linux
  stage: build
  needs: [verify:linux]
  script:
    - cargo build --release --locked
    - target/release/four-p-calibration --help
    - mkdir -p dist
    - cp target/release/four-p-calibration dist/four-p-calibration-x86_64-unknown-linux-gnu
  artifacts:
    paths: [dist/]
    expire_in: 7 days

build:linux-aarch64:
  extends: .zig-cross
  stage: build
  needs: [verify:linux]
  before_script:
    - !reference [.zig-cross, before_script]
    - rustup target add aarch64-unknown-linux-gnu
  script:
    - cargo zigbuild --release --locked --target aarch64-unknown-linux-gnu
    - mkdir -p dist
    - cp target/aarch64-unknown-linux-gnu/release/four-p-calibration dist/four-p-calibration-aarch64-unknown-linux-gnu
  artifacts:
    paths: [dist/]
    expire_in: 7 days

build:windows-x86_64:
  extends: .zig-cross
  stage: build
  needs: [verify:linux]
  before_script:
    - !reference [.zig-cross, before_script]
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo zigbuild --release --locked --target x86_64-pc-windows-gnu
    - mkdir -p dist
    - cp target/x86_64-pc-windows-gnu/release/four-p-calibration.exe dist/four-p-calibration-x86_64-pc-windows-gnu.exe
  artifacts:
    paths: [dist/]
    expire_in: 7 days


build:macos-aarch64:
  extends: .zig-cross
  stage: build
  needs: [verify:linux]
  before_script:
    - !reference [.zig-cross, before_script]
    - rustup target add aarch64-apple-darwin
  script:
    - cargo zigbuild --release --locked --target aarch64-apple-darwin
    - mkdir -p dist
    - cp target/aarch64-apple-darwin/release/four-p-calibration dist/four-p-calibration-aarch64-apple-darwin
  artifacts:
    paths: [dist/]
    expire_in: 7 days

release:github:
  extends: .registry-linux
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-aarch64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
    - job: build:macos-aarch64
      artifacts: true
  script:
    - python3 tools/publish_gitlab_release.py --tag "$CI_COMMIT_TAG" --assets dist
    - python3 tools/publish_github_release.py --tag "$CI_COMMIT_TAG" --assets dist
