workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - prepare
  - verify
  - build
  - release

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.98.1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CORP_INDEX_SSH: "ssh://git@10.21.12.53:2222/corp/rd/camera_corelib.git"
  CORP_INDEX_HTTP: "http://10.21.12.53:8929/corp/rd/camera_corelib.git"
  CROSS_BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/ci-rust-cross:1.98.1-zig-0.13.0-v1"

default:
  cache:
    key:
      files: [Cargo.lock]
      prefix: cargo-v1
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
    policy: pull

.registry-linux:
  image: "$CROSS_BUILDER_IMAGE"
  tags: [wsl, docker]
  before_script:
    - export CARGO_REGISTRIES_CORP_TOKEN="Basic $(printf 'gitlab-ci-token:%s' "$CI_JOB_TOKEN" | base64 -w0)"
    - git config --global url."http://gitlab-ci-token:${CI_JOB_TOKEN}@10.21.12.53:8929/corp/rd/camera_corelib.git".insteadOf "$CORP_INDEX_SSH"

build:cross-builder-image:
  cache: []
  stage: prepare
  image:
    name: "gcr.io/kaniko-project/executor:v1.23.2-debug"
    entrypoint: [""]
  tags: [wsl, docker]
  rules:
    - when: always
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - wget --header="JOB-TOKEN:$CI_JOB_TOKEN" -O "$CI_PROJECT_DIR/ci/zig-linux-x86_64-0.13.0.tar.xz" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ci-toolchain/zig-0.13.0/zig-linux-x86_64-0.13.0.tar.xz"
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/ci/cross-builder.Dockerfile" --destination "$CROSS_BUILDER_IMAGE" --cache=true --cache-repo "$CI_REGISTRY_IMAGE/ci-cache" --insecure-registry "$CI_REGISTRY"


verify:linux:
  extends: .registry-linux
  cache:
    policy: pull-push
  stage: verify
  script:
    - cargo test --locked
    - cargo clippy --all-targets --locked -- -D clippy::correctness

build:linux-x86_64:
  extends: .registry-linux
  stage: build
  needs: [verify:linux]
  script:
    - cargo build --release --locked
    - target/release/four-p-calibration --help
    - mkdir -p dist
    - cp target/release/four-p-calibration dist/four-p-calibration-x86_64-unknown-linux-gnu
  artifacts:
    paths: [dist/]
    expire_in: 7 days

build:linux-aarch64:
  extends: .registry-linux
  stage: build
  needs: [verify:linux]
  script:
    - cargo zigbuild --release --locked --target aarch64-unknown-linux-gnu
    - mkdir -p dist
    - cp target/aarch64-unknown-linux-gnu/release/four-p-calibration dist/four-p-calibration-aarch64-unknown-linux-gnu
  artifacts:
    paths: [dist/]
    expire_in: 7 days

build:windows-x86_64:
  extends: .registry-linux
  stage: build
  needs: [verify:linux]
  script:
    - cargo zigbuild --release --locked --target x86_64-pc-windows-gnu
    - mkdir -p dist
    - cp target/x86_64-pc-windows-gnu/release/four-p-calibration.exe dist/four-p-calibration-x86_64-pc-windows-gnu.exe
  artifacts:
    paths: [dist/]
    expire_in: 7 days


build:macos-aarch64:
  extends: .registry-linux
  stage: build
  needs: [verify:linux]
  script:
    - cargo zigbuild --release --locked --target aarch64-apple-darwin
    - mkdir -p dist
    - cp target/aarch64-apple-darwin/release/four-p-calibration dist/four-p-calibration-aarch64-apple-darwin
  artifacts:
    paths: [dist/]
    expire_in: 7 days

release:github:
  extends: .registry-linux
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-aarch64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
    - job: build:macos-aarch64
      artifacts: true
  script:
    - python3 tools/publish_gitlab_release.py --tag "$CI_COMMIT_TAG" --assets dist
    - python3 tools/publish_github_release.py --tag "$CI_COMMIT_TAG" --assets dist
