[package]
name = "four-p-calibration"
description = "Offline multi-camera and camera-IMU calibration shell"
edition = "2024"
version = "0.1.4"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm-threads = ["dep:wasm-bindgen-rayon", "dep:rayon"]

[dependencies]
anyhow = "1"
ccl_calib = { version = "=0.6.0", registry = "corp" }
ccl_geometry = { version = "=0.1.0", registry = "corp" }
ccl_image = { version = "=0.3.0", registry = "corp" }
ccl_rosbag = { version = "=0.5.0", registry = "corp", features = ["ccl-adapters"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std", "wasmbind"] }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }
rayon = { version = "1", features = ["web_spin_lock"], optional = true }


[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 2

# Unpublished ccl_image workspace implementation, tested together with this consumer.
# Remove this development override when the corresponding corp release is available.
[patch."ssh://git@10.21.12.53:2222/corp/rd/camera_corelib.git"]
ccl_image = { path = "../camera_corelib/crates/ccl_image" }
