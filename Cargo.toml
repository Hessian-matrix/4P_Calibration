[package]
name = "four-p-calibration"
description = "Offline multi-camera and camera-IMU calibration shell"
edition = "2024"
version = "0.1.4"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
ccl_calib = { version = "=0.5.0", registry = "corp" }
ccl_geometry = { version = "=0.1.0", registry = "corp" }
ccl_image = { version = "=0.3.0", registry = "corp" }
ccl_rosbag = { version = "=0.4.0", registry = "corp", features = ["ccl-adapters"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"


[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 2
