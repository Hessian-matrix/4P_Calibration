name: Portable release

on:
  push:
    branches: [feat-4p-calib-rust]
    tags: ['v*']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'tools/release/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  VCPKG_MAX_CONCURRENCY: '2'
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_BINARY_SOURCES: clear
  RIGCAL_DS_BACKEND: rust

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      prefix: ${{ steps.metadata.outputs.prefix }}
      rust: ${{ steps.metadata.outputs.rust }}
      vcpkg: ${{ steps.metadata.outputs.vcpkg }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: metadata
        run: python tools/release/release.py metadata

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      RELEASE_PREFIX: ${{ needs.prepare.outputs.prefix }}
      RUST_VERSION: ${{ needs.prepare.outputs.rust }}
      TARGET: ${{ matrix.target }}
      TRIPLET: ${{ matrix.triplet }}
      LABEL: ${{ matrix.label }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.prepare.outputs.vcpkg }}
          path: .release/vcpkg
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release scripting dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Linux toolchain and desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v python)" tools/release/release.py apt-sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config clang libclang-dev \
            autoconf automake libtool nasm curl zip unzip tar patchelf \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxinerama-dev libxrender-dev libxext-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Pin MSVC linker for Rust
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          rustup target add "$TARGET"
      - name: Cache native SDK and corresponding patched sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .release/vcpkg/installed
            .release/vcpkg/buildtrees/*/src
          key: native-${{ matrix.target }}-${{ hashFiles('tools/release/vcpkg.json', 'tools/release/triplets/*.cmake') }}
      - name: Build release-only native SDK
        run: python tools/release/release.py build-native --vcpkg .release/vcpkg --triplet "$TRIPLET"
      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ needs.prepare.outputs.rust }}-${{ hashFiles('Cargo.lock', 'tools/release/vcpkg.json', 'tools/release/triplets/*.cmake') }}
      - name: Build both production executables
        run: cargo build --locked --release --target "$TARGET" -p rigcal-camera -p rigcal-gui
      - name: Native regression tests
        run: cargo test --locked --release --workspace --target "$TARGET"
      - name: Clippy without warnings
        run: cargo clippy --locked --release --workspace --all-targets --target "$TARGET" -- -D warnings
      - name: Assemble portable runtime and corresponding sources
        run: python tools/release/release.py package --vcpkg .release/vcpkg --prefix "$RELEASE_PREFIX" --label "$LABEL"
      - name: Verify relocated archive without native SDK search paths
        run: python tools/release/release.py smoke --vcpkg .release/vcpkg --prefix "$RELEASE_PREFIX" --label "$LABEL"
      - name: Upload verified archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete matrix and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PREFIX: ${{ needs.prepare.outputs.prefix }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release/release.py publish --directory artifacts --prefix "$RELEASE_PREFIX" --tag "$RELEASE_TAG"
